name: hotel-trivago-platform

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                INSTALL_DEV: 'true'
        image: hotel-trivago-app:latest
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8080}:8080"
        environment:
            APP_ENV: "${APP_ENV:-local}"
            APP_KEY: "${APP_KEY:-base64:wca7yJdccO2HXo2W+Md/vrkwxMyBdiHz1TEO1xZSFmM=}"
            APP_DEBUG: "${APP_DEBUG:-true}"
            APP_URL: "${APP_URL:-http://localhost:8080}"
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: "${DB_DATABASE:-laravel_sail_example}"
            DB_USERNAME: "${DB_USERNAME:-sail}"
            DB_PASSWORD: "${DB_PASSWORD:-password}"
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            MAIL_MAILER: smtp
            MAIL_HOST: mailpit
            MAIL_PORT: 1025
        volumes:
            - ./:/app
            - /app/vendor
            - /app/public/build
            - app_storage:/app/storage
        networks:
            - app-network
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mysql:8.4
        restart: unless-stopped
        ports:
            - "${FORWARD_DB_PORT:-3306}:3306"
        environment:
            MYSQL_DATABASE: "${DB_DATABASE:-laravel_sail_example}"
            MYSQL_USER: "${DB_USERNAME:-sail}"
            MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-password}"
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sail", "-ppassword"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 15s

    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        ports:
            - "${FORWARD_MAILPIT_PORT:-8025}:8025"
            - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    db_data:
        driver: local
    app_storage:
        driver: local
